<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samuel AKINGENEYE — Full Stack Developer from Kigali, Rwanda. Building impactful web applications." />
    <meta name="keywords" content="Samuel AKINGENEYE, Full Stack Developer, Rwanda, React, Node.js, MongoDB" />
    <meta property="og:title" content="Samuel AKINGENEYE — Software Engineer" />
    <meta property="og:description" content="Building tools used by 500+ users across Africa." />
    <meta property="og:type" content="website" />
    <title>Samuel AKINGENEYE — Software Engineer</title>

    <!-- DNS prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Pre-React loading splash — removed the instant React mounts -->
    <style>
      :root { color-scheme: light dark; }
      body  { margin: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; } }

      #pre-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: inherit;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #pre-loader .ring {
        width: 40px; height: 40px;
        border: 3px solid rgba(232,112,58,0.2);
        border-top-color: #E8703A;
        border-radius: 50%;
        animation: pl-spin 0.7s linear infinite;
      }
      #pre-loader .label {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: rgba(148,163,184,0.8);
        letter-spacing: 0.08em;
      }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Visible immediately, before JS executes -->
    <div id="pre-loader">
      <div class="ring"></div>
      <span class="label">samuel.dev</span>
    </div>

    <div id="root"></div>

    <!-- Remove pre-loader once React mounts -->
    <script>
      (function() {
        var r = document.getElementById('root');
        var obs = new MutationObserver(function() {
          if (r.childElementCount > 0) {
            var pl = document.getElementById('pre-loader');
            if (pl) { pl.style.opacity = '0'; setTimeout(function(){ pl.remove(); }, 300); }
            obs.disconnect();
          }
        });
        obs.observe(r, { childList: true });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
